name: GCP VM 자동 배포

on:
  push:
    branches:
      - main   # main 브랜치에 push될 때만 배포

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: GCP VM에 SSH 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key:      ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            set -e
            cd ~/upbit-trader

            echo "📥 최신 코드 받기..."
            git pull origin main

            echo "📦 패키지 업데이트..."
            source venv/bin/activate
            pip install -r requirements.txt --quiet

            echo "🔄 트레이더 재시작..."
            sudo systemctl restart upbit-trader

            echo "🔄 대시보드 재시작..."
            if systemctl cat upbit-dashboard 2>/dev/null | grep -q "streamlit run"; then
              echo "⚠️ 기존 Streamlit 서비스 유지 — VM에서 bash setup.sh를 한 번 실행하면 FastAPI/Nginx로 전환됩니다."
            else
              sudo systemctl restart upbit-dashboard || echo "(대시보드 서비스 미등록 — setup.sh 재실행 필요)"
            fi

            echo "✅ 배포 완료!"
            sudo systemctl status upbit-trader --no-pager
